<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Home Rendering</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Georgia', serif;
      background: linear-gradient(180deg, #87CEEB 0%, #b0d9f0 60%, #c8e6c9 60%, #a5d6a7 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding-bottom: 40px;
      overflow: hidden;
    }

    .scene {
      position: relative;
      width: 900px;
      max-width: 100vw;
    }

    /* Sun */
    .sun {
      position: absolute;
      top: -320px;
      right: 80px;
      width: 80px;
      height: 80px;
      background: radial-gradient(circle, #ffe066 60%, #ffb300 100%);
      border-radius: 50%;
      box-shadow: 0 0 40px 15px rgba(255, 224, 102, 0.45);
    }

    /* Clouds */
    .cloud {
      position: absolute;
      background: white;
      border-radius: 50px;
      opacity: 0.85;
    }
    .cloud::before, .cloud::after {
      content: '';
      position: absolute;
      background: white;
      border-radius: 50%;
    }
    .cloud-1 { top: -300px; left: 60px; width: 120px; height: 35px; }
    .cloud-1::before { width: 60px; height: 55px; top: -28px; left: 15px; }
    .cloud-1::after  { width: 45px; height: 45px; top: -20px; left: 55px; }

    .cloud-2 { top: -350px; left: 280px; width: 100px; height: 30px; }
    .cloud-2::before { width: 50px; height: 48px; top: -24px; left: 10px; }
    .cloud-2::after  { width: 40px; height: 40px; top: -18px; left: 45px; }

    /* Trees (left + right) */
    .tree {
      position: absolute;
      bottom: 50px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .tree-trunk {
      width: 14px;
      height: 50px;
      background: #795548;
      border-radius: 3px;
    }
    .tree-top {
      width: 0;
      height: 0;
    }
    .tree-top-1 {
      border-left: 36px solid transparent;
      border-right: 36px solid transparent;
      border-bottom: 65px solid #388e3c;
      margin-bottom: -8px;
    }
    .tree-top-2 {
      border-left: 44px solid transparent;
      border-right: 44px solid transparent;
      border-bottom: 75px solid #2e7d32;
      margin-bottom: -8px;
    }
    .tree-top-3 {
      border-left: 54px solid transparent;
      border-right: 54px solid transparent;
      border-bottom: 85px solid #1b5e20;
    }
    .tree-left  { left: 30px; }
    .tree-right { right: 30px; }

    /* Shrubs */
    .shrub {
      position: absolute;
      bottom: 48px;
      width: 55px;
      height: 45px;
      background: radial-gradient(ellipse, #66bb6a, #2e7d32);
      border-radius: 50% 50% 45% 45%;
    }
    .shrub-left-1  { left: 200px; }
    .shrub-left-2  { left: 240px; width: 45px; height: 38px; bottom: 48px; }
    .shrub-right-1 { right: 200px; }
    .shrub-right-2 { right: 240px; width: 45px; height: 38px; bottom: 48px; }

    /* House SVG wrapper */
    .house-wrapper {
      display: flex;
      justify-content: center;
    }

    svg.house {
      width: 520px;
      max-width: 95vw;
      height: auto;
      filter: drop-shadow(6px 12px 18px rgba(0,0,0,0.22));
    }

    /* Ground / Lawn */
    .ground {
      width: 900px;
      max-width: 100vw;
      height: 60px;
      background: linear-gradient(180deg, #81c784, #4caf50);
      border-radius: 0 0 0 0;
      position: relative;
    }

    /* Path */
    .path {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 70px;
      height: 60px;
      background: linear-gradient(180deg, #bcaaa4, #a1887f);
      clip-path: polygon(15% 0%, 85% 0%, 100% 100%, 0% 100%);
    }

    /* Driveway */
    .driveway {
      position: absolute;
      bottom: 0;
      left: calc(50% + 80px);
      width: 100px;
      height: 60px;
      background: linear-gradient(180deg, #9e9e9e, #757575);
      clip-path: polygon(10% 0%, 90% 0%, 100% 100%, 0% 100%);
    }

    /* Label */
    .label {
      margin-top: 28px;
      text-align: center;
      color: #2c3e50;
      letter-spacing: 0.06em;
    }
    .label h1 {
      font-size: 1.9rem;
      font-weight: normal;
      color: #1a3a2a;
    }
    .label p {
      font-size: 0.95rem;
      color: #4a6350;
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <div class="scene">
    <!-- Sky elements -->
    <div class="sun"></div>
    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>

    <!-- Trees -->
    <div class="tree tree-left">
      <div class="tree-top tree-top-1"></div>
      <div class="tree-top tree-top-2"></div>
      <div class="tree-top tree-top-3"></div>
      <div class="tree-trunk"></div>
    </div>
    <div class="tree tree-right">
      <div class="tree-top tree-top-1"></div>
      <div class="tree-top tree-top-2"></div>
      <div class="tree-top tree-top-3"></div>
      <div class="tree-trunk"></div>
    </div>

    <!-- Shrubs -->
    <div class="shrub shrub-left-1"></div>
    <div class="shrub shrub-left-2"></div>
    <div class="shrub shrub-right-1"></div>
    <div class="shrub shrub-right-2"></div>

    <!-- House SVG -->
    <div class="house-wrapper">
      <svg class="house" viewBox="0 0 520 380" xmlns="http://www.w3.org/2000/svg">

        <!-- Main body -->
        <rect x="40" y="170" width="440" height="210" fill="#EFEBE9" rx="2"/>

        <!-- Brick texture rows -->
        <g fill="none" stroke="#D7CCC8" stroke-width="0.6" opacity="0.6">
          <line x1="40" y1="195" x2="480" y2="195"/>
          <line x1="40" y1="220" x2="480" y2="220"/>
          <line x1="40" y1="245" x2="480" y2="245"/>
          <line x1="40" y1="270" x2="480" y2="270"/>
          <line x1="40" y1="295" x2="480" y2="295"/>
          <line x1="40" y1="320" x2="480" y2="320"/>
          <line x1="40" y1="345" x2="480" y2="345"/>
          <!-- Vertical offsets alternating -->
          <line x1="80"  y1="170" x2="80"  y2="195"/><line x1="120" y1="195" x2="120" y2="220"/>
          <line x1="160" y1="170" x2="160" y2="195"/><line x1="200" y1="195" x2="200" y2="220"/>
          <line x1="240" y1="170" x2="240" y2="195"/><line x1="280" y1="195" x2="280" y2="220"/>
          <line x1="320" y1="170" x2="320" y2="195"/><line x1="360" y1="195" x2="360" y2="220"/>
          <line x1="400" y1="170" x2="400" y2="195"/><line x1="440" y1="195" x2="440" y2="220"/>
        </g>

        <!-- Main roof -->
        <polygon points="20,175 260,30 500,175" fill="#5D4037"/>
        <!-- Roof ridge highlight -->
        <polygon points="20,175 260,30 500,175" fill="none" stroke="#4E342E" stroke-width="2"/>
        <!-- Roof shingles (decorative lines) -->
        <g fill="none" stroke="#4E342E" stroke-width="1" opacity="0.35">
          <line x1="20"  y1="175" x2="260" y2="30"/>
          <line x1="60"  y1="175" x2="260" y2="50"/>
          <line x1="100" y1="175" x2="260" y2="70"/>
          <line x1="140" y1="175" x2="260" y2="90"/>
          <line x1="180" y1="175" x2="260" y2="115"/>
          <line x1="500" y1="175" x2="260" y2="30"/>
          <line x1="460" y1="175" x2="260" y2="50"/>
          <line x1="420" y1="175" x2="260" y2="70"/>
          <line x1="380" y1="175" x2="260" y2="90"/>
          <line x1="340" y1="175" x2="260" y2="115"/>
        </g>

        <!-- Chimney -->
        <rect x="330" y="55" width="40" height="85" fill="#6D4C41"/>
        <rect x="325" y="50" width="50" height="12" fill="#5D4037" rx="1"/>

        <!-- Garage section (right) -->
        <rect x="310" y="210" width="170" height="170" fill="#E0D7D0" rx="2"/>
        <!-- Garage door panels -->
        <rect x="320" y="220" width="150" height="140" fill="#BDBDBD" rx="3"/>
        <line x1="320" y1="255" x2="470" y2="255" stroke="#9E9E9E" stroke-width="2"/>
        <line x1="320" y1="290" x2="470" y2="290" stroke="#9E9E9E" stroke-width="2"/>
        <line x1="320" y1="325" x2="470" y2="325" stroke="#9E9E9E" stroke-width="2"/>
        <line x1="395" y1="220" x2="395" y2="360" stroke="#9E9E9E" stroke-width="2"/>
        <!-- Garage door handle -->
        <rect x="387" y="315" width="16" height="6" fill="#757575" rx="3"/>

        <!-- Front door -->
        <rect x="210" y="255" width="70" height="125" fill="#5D4037" rx="3"/>
        <rect x="217" y="263" width="25" height="35" fill="#8D6E63" rx="2"/>
        <rect x="248" y="263" width="25" height="35" fill="#8D6E63" rx="2"/>
        <!-- Door knob -->
        <circle cx="247" cy="330" r="4" fill="#FFD54F"/>
        <!-- Door arch top -->
        <path d="M210,255 Q245,225 280,255" fill="#6D4C41"/>

        <!-- Porch step -->
        <rect x="195" y="375" width="100" height="10" fill="#BCAAA4" rx="2"/>
        <rect x="200" y="368" width="90"  height="9"  fill="#D7CCC8" rx="2"/>

        <!-- Left window (large) -->
        <rect x="55" y="210" width="110" height="90" fill="#B3E5FC" rx="3"/>
        <rect x="55" y="210" width="110" height="90" fill="none" stroke="#78909C" stroke-width="3" rx="3"/>
        <line x1="110" y1="210" x2="110" y2="300" stroke="#78909C" stroke-width="2"/>
        <line x1="55"  y1="255" x2="165" y2="255" stroke="#78909C" stroke-width="2"/>
        <!-- Window reflection -->
        <polygon points="60,215 90,215 60,240" fill="white" opacity="0.25"/>

        <!-- Right window (upper, above garage) -->
        <rect x="330" y="175" width="80" height="60" fill="#B3E5FC" rx="3"/>
        <rect x="330" y="175" width="80" height="60" fill="none" stroke="#78909C" stroke-width="3" rx="3"/>
        <line x1="370" y1="175" x2="370" y2="235" stroke="#78909C" stroke-width="2"/>
        <line x1="330" y1="205" x2="410" y2="205" stroke="#78909C" stroke-width="2"/>
        <polygon points="335,180 360,180 335,200" fill="white" opacity="0.25"/>

        <!-- Small dormer window -->
        <polygon points="180,100 230,65 280,100" fill="#5D4037"/>
        <rect x="193" y="100" width="74" height="50" fill="#B3E5FC" rx="2"/>
        <rect x="193" y="100" width="74" height="50" fill="none" stroke="#78909C" stroke-width="2" rx="2"/>
        <line x1="230" y1="100" x2="230" y2="150" stroke="#78909C" stroke-width="1.5"/>
        <polygon points="197,104 215,104 197,118" fill="white" opacity="0.25"/>

        <!-- Foundation -->
        <rect x="40" y="370" width="440" height="10" fill="#BCAAA4" rx="1"/>

        <!-- Fascia board -->
        <rect x="16" y="170" width="488" height="10" fill="#4E342E" rx="1"/>
      </svg>
    </div>

    <!-- Ground -->
    <div class="ground">
      <div class="path"></div>
      <div class="driveway"></div>
    </div>
  </div>

  <div class="label">
    <h1>New Home Rendering</h1>
    <p>3 Bed &nbsp;·&nbsp; 2 Bath &nbsp;·&nbsp; 2-Car Garage &nbsp;·&nbsp; ~2,200 sq ft</p>
  </div>

</body>
</html>
